<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A153A" />
      <stop offset="50%" stop-color="#0E0C1E" />
      <stop offset="100%" stop-color="#07060E" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B7BFF" />
      <stop offset="100%" stop-color="#5438FF" />
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="115" fill="url(#bg)" />

  <!-- Subtle Dream Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#5438FF" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#8B7BFF" stroke-width="1.5" stroke-opacity="0.35" />

  <!-- Center Nebula Glow -->
  <circle cx="256" cy="256" r="70" fill="#5438FF" opacity="0.35" filter="url(#blur)" />

  <!-- Lucid Crescent Moon & Eye / Portal Motif -->
  <path d="M290 150 C210 160 170 230 180 310 C186 360 220 400 270 410 C210 395 160 340 160 270 C160 190 220 135 290 150 Z" fill="url(#glow)" />
  
  <!-- Dream Star Sparkle -->
  <path d="M330 200 Q330 230 360 230 Q330 230 330 260 Q330 230 300 230 Q330 230 330 200 Z" fill="#E2DCFF" opacity="0.95" />
  <circle cx="256" cy="256" r="6" fill="#FFFFFF" opacity="0.9" />
  <circle cx="360" cy="310" r="4" fill="#8B7BFF" opacity="0.8" />
  <circle cx="190" cy="180" r="3" fill="#E2DCFF" opacity="0.7" />
</svg>
